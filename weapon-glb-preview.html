<!doctype html>
<html><head><meta charset="utf-8"><title>GLB Weapon Preview</title>
<style>html,body{margin:0;height:100%;background:#14171a;overflow:hidden}#c{width:100%;height:100%;display:block}#info{position:fixed;left:12px;top:12px;color:#9fe;font:12px monospace;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/jsm/"}}</script>
</head><body><canvas id="c"></canvas><div id="info">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2126);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new THREE.Scene().add(new THREE.HemisphereLight(0xbfd8ff, 0x33261a, 1)), 0).texture;
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
camera.position.set(1.35, 0.8, 1.7);
camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xd7e6ff, 0x2a1d12, 1.2));
const d = new THREE.DirectionalLight(0xffe4c4, 3.2); d.position.set(2,3,4); scene.add(d);
const d2 = new THREE.DirectionalLight(0x8fc2ff, 2.4); d2.position.set(-3,1,-2); scene.add(d2);
const d3 = new THREE.DirectionalLight(0xff9a50, 1.6); d3.position.set(0,-2,-3); scene.add(d3);
const grid = new THREE.GridHelper(4, 20, 0x556, 0x334); grid.position.y = -0.35; scene.add(grid);
const info = document.getElementById('info');

const gltf = await new GLTFLoader().loadAsync('/assets/models/lvoa.glb');
const model = gltf.scene;
model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.envMapIntensity = 1.1; } });
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
model.position.sub(center);
const pivot = new THREE.Group();
pivot.add(model);
scene.add(pivot);
const maxDim = Math.max(size.x, size.y, size.z);
pivot.scale.setScalar(1.25 / maxDim);
pivot.rotation.y = 0;
info.textContent = `size ${size.x.toFixed(3)} ${size.y.toFixed(3)} ${size.z.toFixed(3)}`;
window.__preview = { scene, camera, model, pivot, size };
function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); }
loop();
</script></body></html>
