<!doctype html>
<html><head><meta charset="utf-8"><title>Weapon Preview</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#c{width:100%;height:100%;display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createRifle, createPistol } from './src/weapons.js';
import { makeSkyEnvironment } from './src/textures.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x565b60);
scene.environment = makeSkyEnvironment(renderer);
scene.environmentIntensity = 1.1;
const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.01, 100);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
const d = new THREE.DirectionalLight(0xffe0c0, 3.5); d.position.set(1,2,3); scene.add(d);
const d2 = new THREE.DirectionalLight(0x88bbff, 2); d2.position.set(-2,1,-1); scene.add(d2);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const rig = new THREE.Group();
rig.scale.setScalar(1.2);
rig.position.set(0, 0, -2.2);
rig.rotation.set(0, Math.PI/2, 0);
camera.add(rig);
const rifle = createRifle(); rig.add(rifle);
// small ground reference lines
const grid = new THREE.GridHelper(4, 20, 0x888888, 0x333333); grid.position.set(0, -1.6, -2); scene.add(grid);
function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); }
loop();
</script></body></html>
